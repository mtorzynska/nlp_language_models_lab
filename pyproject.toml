[project]
name = "nlp-language-models-lab"
version = "0.1.0"
description = "Strojenie HerBERT i polish-gpt2 (PEFT) na PolEmo2: klasyfikacja tekstu i tokenów"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0",
    "transformers>=4.45",
    "numpy>=2.0",
    "torch>=2.14.1",
    "loguru>=0.7.3",
    "peft>=0.21.2",
    "evaluate>=0.4.6",
    "scikit-learn>=1.9.1",
]

# kod uruchamiany z katalogu repo jako pakiet src (python -m src.data.prepare), bez instalacji
[tool.uv]
package = false
